services:
  app:
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - app_modules:/app/node_modules
      - app_next:/app/.next
    command: npm run dev
    healthcheck:
      start_period: 60s
volumes:
  app_modules:
  app_next:
